<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Premium Dark Blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2E6D" />
      <stop offset="50%" stop-color="#0B1643" />
      <stop offset="100%" stop-color="#050A24" />
    </linearGradient>
    
    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2E6C9" />
      <stop offset="50%" stop-color="#EEDCAC" />
      <stop offset="100%" stop-color="#CFBC98" />
    </linearGradient>
    
    <!-- Ice Blue Gradient for Snowflake/Refrigeration element -->
    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A5C7E6" />
    </linearGradient>

    <!-- Glossy Overlay Gradient -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop Shadow Filter for 3D Effect -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with border -->
  <circle cx="256" cy="256" r="236" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" filter="url(#dropShadow)" />

  <!-- Stylized letter 'N' with professional refrigeration concept -->
  <g filter="url(#dropShadow)">
    <!-- Left Pillar of N -->
    <path d="M150 140 L200 140 L200 372 L150 372 Z" fill="url(#iceGrad)" />
    
    <!-- Right Pillar of N -->
    <path d="M312 140 L362 140 L362 372 L312 372 Z" fill="url(#iceGrad)" />
    
    <!-- Diagonal of N, stylized as a sleek breeze/airflow -->
    <path d="M200 140 L312 372 L272 372 L180 172 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Snowflake icon overlayed in the upper right to represent refrigeration -->
  <g transform="translate(337, 140) scale(0.6)" stroke="url(#iceGrad)" stroke-width="12" stroke-linecap="round" opacity="0.9" filter="url(#glow)">
    <line x1="0" y1="-50" x2="0" y2="50" />
    <line x1="-50" y1="0" x2="50" y2="0" />
    <line x1="-35" y1="-35" x2="35" y2="35" />
    <line x1="-35" y1="35" x2="35" y2="-35" />
    <!-- V-shapes on branches -->
    <path d="M-15 -35 L0 -20 L15 -35" fill="none" />
    <path d="M-15 35 L0 20 L15 35" fill="none" />
    <path d="M-35 -15 L-20 0 L-35 15" fill="none" />
    <path d="M 35 -15 L 20 0 L 35 15" fill="none" />
  </g>

  <!-- Glossy overlay for a premium glass / 3D sphere effect -->
  <path d="M20 256 C20 126 126 20 256 20 C386 20 492 126 492 256 C492 256 380 200 256 200 C132 200 20 256 20 256 Z" fill="url(#glossGrad)" />
</svg>
